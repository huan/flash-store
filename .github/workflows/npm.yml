name: NPM

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: npm ci
      - run: npm test
      - run: npm run test:deno

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: npm ci
      - run: npm run coverage:node
      - run: npm run coverage:deno
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: node-coverage
          path: |
            coverage/node/lcov.info
            coverage/node/html/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deno-coverage
          path: |
            coverage/deno/lcov.info
            coverage/deno/raw/html/

  pack:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:pack

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    needs: [test, coverage, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing exchanges this OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          # npm advises against dependency caches in release builds.
          package-manager-cache: false
      - name: Require npm with Trusted Publishing support
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1))))
              throw new Error(`npm ${process.argv[1]} is older than 11.5.1`)
          ' "$(npm --version)"
      - run: npm ci
      - name: Publish release branches
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/heads/(main|v[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            if [[ "${VERSION%%+*}" == *-* ]]; then TAG=next; else TAG=latest; fi
            npm publish --tag "$TAG"
          fi
